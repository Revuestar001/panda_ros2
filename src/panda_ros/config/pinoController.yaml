controller_manager:
  ros__parameters:
    update_rate: 500

joint_state_broadcaster:
  ros__parameters:
    update_rate: 500
    type: joint_state_broadcaster/JointStateBroadcaster

effort_controller:
  ros__parameters:
    type: effort_controllers/JointGroupEffortController
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7


